[package]
name = "gpui-hooks-macros"
version = "0.1.0"
edition = "2024"
description = "Procedural macros for GPUI Hooks - React-style hooks for GPUI framework"
license = "MIT"
repository = "https://github.com/leset0ng/gpui-hooks"
keywords = ["gpui", "hooks", "react", "gui", "macros"]
categories = ["gui", "development-tools"]
readme = "../README.md"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"